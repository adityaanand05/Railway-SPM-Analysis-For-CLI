            <span id="buttonText">Select a file to process</span>

    <script>
      // Configuration object for constants and settings
      const CONFIG = {
        SUPPORTED_EXTENSIONS: {
          txt: 'text/plain',
          pdf: 'application/pdf',
          docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
          doc: 'application/msword',
          xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          xls: 'application/vnd.ms-excel'
        },
        SUBTRACT_VALUES: [0.100, 0.500, 1.000],
        RANGE_TOLERANCE: 0.010,
        MAX_FILE_SIZE: 10 * 1024 * 1024 // 10MB
      };

      // UI Controller Module
      const UIController = {
        elements: {
          fileInput: document.getElementById('fileInput'),
          processBtn: document.getElementById('processBtn'),
          results: document.getElementById('results'),
          fileInfo: document.getElementById('fileInfo'),
          buttonText: document.getElementById('buttonText'),
          loadingSpinner: document.getElementById('loadingSpinner'),
          dropZone: document.querySelector('.file-input-wrapper')
        },

        showLoading() {
          this.elements.processBtn.disabled = true;
          this.elements.loadingSpinner.classList.remove('hidden');
          this.elements.buttonText.textContent = 'Processing...';
          this.elements.results.innerHTML = '';
        },

        hideLoading() {
          this.elements.processBtn.disabled = false;
          this.elements.loadingSpinner.classList.add('hidden');
          this.elements.buttonText.textContent = 'Process File';
        },

        updateFileInfo(file) {
          if (file) {
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            this.elements.buttonText.textContent = 'Process File';
            this.elements.fileInfo.textContent = `Selected file: ${file.name} (${sizeMB} MB)`;
            this.elements.processBtn.disabled = false;
          } else {
            this.elements.buttonText.textContent = 'Select a file to process';
            this.elements.fileInfo.textContent = '';
            this.elements.processBtn.disabled = true;
          }
        },

        showError(message, isWarning = false) {
          const colorClass = isWarning ? 'yellow' : 'red';
          this.elements.results.innerHTML = `
            <div class="bg-${colorClass}-50 border-l-4 border-${colorClass}-400 p-4">
              <div class="flex">
                <div class="flex-shrink-0">
                  ${this.getErrorIcon(isWarning)}
                </div>
                <div class="ml-3">
                  <p class="text-sm text-${colorClass}-700">${message}</p>
                </div>
              </div>
            </div>`;
        },

        getErrorIcon(isWarning) {
          return isWarning ? 
            '<svg class="h-5 w-5 text-yellow-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>' :
            '<svg class="h-5 w-5 text-red-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>';
        },

        displayResults(results) {
          if (results.length === 0) {
            this.showError('No rows found with zero in the fourth column.', true);
            return;
          }

          let output = '';
          results.forEach((result, index) => {
            // Add index + 1 to the result object
            result.index = index + 1;
            output += this.createResultCard(result);
          });
          this.elements.results.innerHTML = output;
        },

        createResultCard(result) {
          const { originalRow, matches, index } = result;
          
          const formattedOriginal = {
            date: this.formatDate(originalRow[0]),
            time: originalRow[1],
            distance: `${parseFloat(originalRow[2]).toFixed(3)} Km`,
            speed: `${originalRow[3]} km/h`
          };

          return `
            <div class="result-card fade-in bg-white rounded-2xl shadow-lg overflow-hidden transition-all duration-300 hover:shadow-2xl transform hover:-translate-y-1">
              <div class="p-8 border-b border-gray-100">
                <div class="flex items-center justify-between mb-6">
                  <h3 class="text-2xl font-bold text-gray-800">Original Values</h3>
                  <span class="px-4 py-2 bg-blue-100 text-blue-800 rounded-full text-sm font-medium">Record #${index}</span>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                  <div class="bg-gray-50 rounded-xl p-4 hover:bg-blue-50 transition-colors">
                    <span class="block text-sm font-medium text-gray-500 mb-1">Date =</span>
                    <span class="block text-lg font-semibold text-gray-800">${formattedOriginal.date}</span>
                  </div>
                  <div class="bg-gray-50 rounded-xl p-4 hover:bg-blue-50 transition-colors">
                    <span class="block text-sm font-medium text-gray-500 mb-1">Time =</span>
                    <span class="block text-lg font-semibold text-gray-800">${formattedOriginal.time}</span>
                  </div>
                  <div class="bg-gray-50 rounded-xl p-4 hover:bg-blue-50 transition-colors">
                    <span class="block text-sm font-medium text-gray-500 mb-1">Distance =</span>
                    <span class="block text-lg font-semibold text-gray-800">${formattedOriginal.distance}</span>
                  </div>
                  <div class="bg-gray-50 rounded-xl p-4 hover:bg-blue-50 transition-colors">
                    <span class="block text-sm font-medium text-gray-500 mb-1">Speed =</span>
                    <span class="block text-lg font-semibold text-gray-800">${formattedOriginal.speed}</span>
                  </div>
                </div>
              </div>
              <div class="p-8 space-y-6 bg-gray-50">
                ${matches.map(match => this.createMatchRow(match)).join('')}
              </div>
            </div>`;
        },

        createMatchRow({ subtractValue, targetValue, closestRow }) {
          const formattedMatch = closestRow ? {
            date: this.formatDate(closestRow[0]),
            time: closestRow[1],
            distance: `${parseFloat(closestRow[2]).toFixed(3)} Km`,
            speed: `${closestRow[3]} km/h`
          } : null;

          return `
            <div class="transform transition-all duration-300 hover:scale-[1.02]">
              <div class="flex flex-wrap items-center gap-3 mb-3">
                <span class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium ${
                  closestRow ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'
                }">
                  <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                  Target: ${targetValue.toFixed(3)}
                </span>
                <span class="inline-flex items-center px-4 py-2 rounded-full bg-blue-100 text-blue-800 text-sm font-medium">
                  <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
                  </svg>
                  Subtract: ${subtractValue.toFixed(3)}
                </span>
              </div>
              ${closestRow ? `
                <div class="bg-white rounded-xl border border-green-200 p-6 shadow-sm hover:shadow-md transition-shadow">
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                    <div class="flex flex-col">
                      <span class="text-sm font-medium text-gray-500 mb-1">Date =</span>
                      <span class="text-lg font-semibold text-gray-800">${formattedMatch.date}</span>
                    </div>
                    <div class="flex flex-col">
                      <span class="text-sm font-medium text-gray-500 mb-1">Time =</span>
                      <span class="text-lg font-semibold text-gray-800">${formattedMatch.time}</span>
                    </div>
                    <div class="flex flex-col">
                      <span class="text-sm font-medium text-gray-500 mb-1">Distance =</span>
                      <span class="text-lg font-semibold text-gray-800">${formattedMatch.distance}</span>
                    </div>
                    <div class="flex flex-col">
                      <span class="text-sm font-medium text-gray-500 mb-1">Speed =</span>
                      <span class="text-lg font-semibold text-gray-800">${formattedMatch.speed}</span>
                    </div>
                  </div>
                </div>` : 
                '<div class="text-sm text-gray-500 p-6 bg-gray-50 rounded-xl border border-gray-200">No matching value found</div>'}
            </div>`;
        },

        // Helper method for date formatting
        formatDate(dateStr) {
          try {
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) {
              const parts = dateStr.split('/');
              if (parts.length === 3) {
                return `${parts[0].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[2]}`;
              }
              return dateStr;
            }
            return date.toLocaleDateString('en-GB', {
              day: '2-digit',
              month: '2-digit',
              year: 'numeric'
            });
          } catch (e) {
            return dateStr;
          }
        }
      };

      // Data Processing Module
      const DataProcessor = {
        parseTextToLines(text) {
          return text.split(/\r?\n/)
            .filter(line => line.trim() !== "")
            .map(line => line.trim().split(/\s+/));
        },

        findZeroInFourthColumn(lines) {
          return lines.filter(line => line.length >= 4 && line[3] === '0');
        },

        findClosestValue(rows, targetValue, rangeLow, rangeHigh) {
          return rows.reduce((closest, row) => {
            const value = parseFloat(row[2]);
            if (isNaN(value) || value < rangeLow || value > rangeHigh) return closest;
            
            const diff = Math.abs(value - targetValue);
            return (!closest || diff < closest.diff) ? { row, diff } : closest;
          }, null)?.row;
        },

        processData(textContent) {
          const lines = this.parseTextToLines(textContent);
          const rowsWithZero = this.findZeroInFourthColumn(lines);
          
          return rowsWithZero.map(zeroRow => {
            const originalValue = parseFloat(zeroRow[2]);
            if (isNaN(originalValue)) return null;

            const matches = CONFIG.SUBTRACT_VALUES.map(subtractValue => {
              const targetValue = originalValue - subtractValue;
              const rangeLow = targetValue - CONFIG.RANGE_TOLERANCE;
              const rangeHigh = targetValue + CONFIG.RANGE_TOLERANCE;
              return {
                subtractValue,
                targetValue,
                closestRow: this.findClosestValue(lines, targetValue, rangeLow, rangeHigh)
              };
            });

            return {
              originalRow: zeroRow,
              matches
            };
          }).filter(Boolean);
        }
      };

      // File Handler Module
      const FileHandler = {
        async readFile(file) {
          // Validate file size
          if (file.size > CONFIG.MAX_FILE_SIZE) {
            throw new Error('File size exceeds the maximum limit of 10MB.');
          }

          const extension = file.name.split('.').pop().toLowerCase();
          switch (extension) {
            case 'txt':
              return this.readTextFile(file);
            case 'pdf':
              return this.readPDFFile(file);
            case 'doc':
            case 'docx':
              return this.readDOCXFile(file);
            case 'xls':
            case 'xlsx':
              return this.readExcelFile(file);
            default:
              throw new Error('Unsupported file type.');
          }
        },

        readTextFile(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = () => reject(new Error('Error reading text file.'));
            reader.readAsText(file);
          });
        },

        async readPDFFile(file) {
          const arrayBuffer = await this.readFileAsArrayBuffer(file);
          const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
          let fullText = '';
          
          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const content = await page.getTextContent();
            fullText += content.items.map(item => item.str).join(' ') + '\n';
          }
          
          return fullText;
        },

        async readDOCXFile(file) {
          const arrayBuffer = await this.readFileAsArrayBuffer(file);
          const result = await mammoth.extractRawText({ arrayBuffer });
          return result.value;
        },

        async readExcelFile(file) {
          const arrayBuffer = await this.readFileAsArrayBuffer(file);
          const data = new Uint8Array(arrayBuffer);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          return XLSX.utils.sheet_to_csv(worksheet);
        },

        readFileAsArrayBuffer(file) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = () => reject(new Error(`Error reading ${file.type} file.`));
            reader.readAsArrayBuffer(file);
          });
        }
      };

      // Main Application Controller
      const App = {
        async init() {
          this.setupEventListeners();
        },

        setupEventListeners() {
          // File input change handler
          UIController.elements.fileInput.addEventListener('change', 
            e => this.handleFileSelection(e.target.files[0]));

          // Process button click handler
          UIController.elements.processBtn.addEventListener('click', 
            () => this.processFile());

          // Drag and drop handlers
          this.setupDragAndDrop();
        },

        setupDragAndDrop() {
          const dropZone = UIController.elements.dropZone;
          
          ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => {
              e.preventDefault();
              e.stopPropagation();
            });
          });

          ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
              dropZone.querySelector('div').classList.add('border-blue-500');
            });
          });

          ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => {
              dropZone.querySelector('div').classList.remove('border-blue-500');
            });
          });

          dropZone.addEventListener('drop', e => {
            const file = e.dataTransfer.files[0];
            this.handleFileSelection(file);
          });
        },

        handleFileSelection(file) {
          if (!file) return;
          
          // Update UI with file info
          UIController.updateFileInfo(file);
          
          // Validate file type
          const extension = file.name.split('.').pop().toLowerCase();
          if (!CONFIG.SUPPORTED_EXTENSIONS[extension]) {
            UIController.showError('Unsupported file type.');
            return;
          }
        },

        async processFile() {
          const file = UIController.elements.fileInput.files[0];
          if (!file) {
            UIController.showError('Please select a file.');
            return;
          }

          try {
            UIController.showLoading();
            
            // Read and process the file
            const content = await FileHandler.readFile(file);
            const results = DataProcessor.processData(content);
            
            // Display results
            UIController.displayResults(results);
          } catch (error) {
            UIController.showError(error.message);
            console.error('Processing error:', error);
          } finally {
            UIController.hideLoading();
          }
        }
      };

      // Initialize the application
      document.addEventListener('DOMContentLoaded', () => {
        App.init();
      });
    </script>
  </body>
</html>
